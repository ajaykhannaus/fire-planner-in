name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run calculation tests
        run: npm test
        working-directory: website
      - name: Stamp version
        # Versioned file links make browsers fetch fresh CSS/JS on every deploy;
        # version.json lets open pages notice a newer deploy.
        run: |
          v="${GITHUB_SHA::8}"
          cd website/dist
          sed -i "s/?v=dev/?v=$v/g" index.html app.js
          sed -i "s/const APP_VERSION='dev'/const APP_VERSION='$v'/" app.js
          printf '{"version":"%s"}\n' "$v" > version.json
          grep -q "APP_VERSION='$v'" app.js
          ! grep -q "v=dev" index.html app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - id: deployment
        uses: actions/deploy-pages@v4
